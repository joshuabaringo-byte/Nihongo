name: Website veröffentlichen

on:
  push:
    branches:
      - main
      - master
      - claude/iphone-vokabeltrainer-website-kf707p
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Setzt voraus, dass unter Settings -> Pages als Source einmal
      # "GitHub Actions" gewaehlt wurde. Selbst einschalten darf die
      # Aktion es nicht, dafuer reicht das Recht ihres Tokens nicht.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
